name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily-digest-podcast
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: daily-digest-podcast/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: pytest tests -q

  briefing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morning-echo-briefing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: morning-echo-briefing/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest tests.test_briefing -q
