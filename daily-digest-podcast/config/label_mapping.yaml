# 大雑把なジャンル(MECEを意識した9種類、最後の「その他」は受け皿)の定義。
#
# genres の並び順がそのまま「選べるジャンル一覧」になる(config/labels.yamlの
# ON/OFF一覧はここが唯一のソース)。フィード側(feeds.yaml)にはジャンルの
# 概念はなく、記事ごとに毎回ここで分類される。
#
# 記事の分類方法:
#   元記事のタグ・タイトルを小文字にして、keywords のどれかが部分一致すれば、
#   そのジャンルに分類される(1記事が複数ジャンルに入ってもよい)。
#   どのジャンルのキーワードにも一致しなかった場合は「その他」に分類される
#   (＝必ず1つ以上のジャンルが付く)。
#
# ジャンルの追加・削除・キーワードの調整はここを直接編集すればよい。
# (ラベルのON/OFF一覧にもすぐ反映される)

genres:
  AI:
    keywords:
      - ai
      - artificial intelligence
      - machine learning
      - llm
      - gpt
      - gemini
      - claude
      - anthropic
      - chatgpt
      - deepmind
      - 生成ai
      - 機械学習
      - 人工知能

  プログラミング:
