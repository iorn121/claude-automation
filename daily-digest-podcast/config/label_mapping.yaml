      - malware
      - password
      - vulnerab
      - cve
      - cyber
      - cryptograph
      - phishing
      - clickfix
      - exploit
      - ransomware
      - セキュリティ
      - 脆弱性
      - 攻撃

  インフラ・クラウド:
    keywords:
      - cloud
      - azure
      - aws
      - gcp
      - kubernetes
      - docker
      - devops
      - database
      - networking
      - server
      - infrastructure
      - インフラ
      - クラウド

  ガジェット・OS:
