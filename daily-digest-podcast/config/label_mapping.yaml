      - linux
      - hardware
      - device
      - chip

  ロボット:
    keywords:
      - robot
      - robots
      - drone
      - automation
      - autonomous

  宇宙・科学:
    keywords:
      - space
      - nasa
      - rocket
      - satellite
      - astro
      - physics
      - quantum
      - science
      - esa
      - planetary
      - 宇宙
      - 科学

  ビジネス・社会:
    keywords:
      - business
      - lawsuit
      - bankruptcy
      - policy
      - patent
      - intellectual property
      - market
      - economy
      - ビジネス
      - 経済
      - 法務

  その他:
    # どのジャンルのキーワードにも一致しなかった記事の受け皿(必ず1つ以上のジャンルを
    # 付けるためのフォールバック)。keywordsは空のままにする(直接ここに一致させない)。
    keywords: []
