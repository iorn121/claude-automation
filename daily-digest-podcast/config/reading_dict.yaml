# TTS（VOICEVOX）向けの読み上げマスタデータ。
# synthesize.py が台本を音声合成する直前に、surface を reading（カタカナ等）へ置換する。
#
# 追加方法:
#   - surface: 台本に現れる表記（英字は大文字小文字を区別しない）
#   - reading: 読み上げたいカタカナ（またはひらがな）
#   - 英数字の surface は単語境界でマッチ（例: "Qiita" は "Qiita人気" にもマッチし、
#     "NotQiita" のような連結英字にはマッチしない）
#   - 長い surface から優先して置換する（部分一致の食い合いを防ぐ）
#
# Issue #3: 「Qiita」が「ちーた」と読まれていた → 「キータ」に固定。

readings:
  # --- Issue #3 報告 ---
  - surface: Qiita
    reading: キータ

  # --- 収集フィード／台本に出やすい固有名詞 ---
  - surface: GitHub
    reading: ギットハブ
  - surface: GitLab
    reading: ギットラボ
  - surface: Zenn
    reading: ゼン
  - surface: "dev.to"
    reading: デブドットティーオー
  - surface: ITmedia
    reading: アイティーメディア
  - surface: "Hacker News"
    reading: ハッカーニュース
  - surface: "Ars Technica"
    reading: アーズテクニカ
  - surface: "The Hacker News"
    reading: ザハッカーニュース
  - surface: JPCERT
    reading: ジェイピーサート
  - surface: "JPCERT/CC"
    reading: ジェイピーサートシーシー

  # --- AI / クラウド系で誤読されやすいもの ---
  - surface: ChatGPT
